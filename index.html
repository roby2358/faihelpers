<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fai Helpers</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div class="tab-bar">
        <button class="tab-button active" data-tab="chat">Chat</button>
        <button class="tab-button" data-tab="docmem">Docmem</button>
        <button class="tab-button" data-tab="view">View</button>
        <button class="tab-button" data-tab="persist">Persist</button>
    </div>
    
    <div id="app">
        <div id="chat-tab" class="tab-content active">
            <div class="chat-controls">
                <div class="toolbar chat-settings">
                    <input type="password" id="chat-api-key" class="input" placeholder="OpenRouter API Key" />
                    <select id="chat-model" class="input">
                        <option value="anthropic/claude-haiku-4.5">Claude Haiku 4.5</option>
                        <option value="anthropic/claude-sonnet-5">Claude Sonnet 5</option>
                        <option value="anthropic/claude-opus-5">Claude Opus 5</option>
                        <option value="deepseek/deepseek-v4-flash-0731">DeepSeek V4 Flash</option>
                        <option value="deepseek/deepseek-v4-pro-0813" selected>DeepSeek V4 Pro</option>
                        <option value="deepseek/deepseek-v3.2">DeepSeek V3.2</option>
                        <option value="google/gemini-3.8-flash">Gemini 3.8 Flash</option>
                        <option value="google/gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
                        <option value="z-ai/glm-5.3-flash">GLM 5.3 Flash</option>
                        <option value="z-ai/glm-5.3">GLM 5.3</option>
                        <option value="openai/gpt-5.6-luna">GPT 5.6 Luna</option>
                        <option value="openai/gpt-5.4-mini">GPT 5.4 Mini</option>
                        <option value="moonshotai/kimi-k3">Kimi K3</option>
                        <option value="qwen/qwen3.8-flash">Qwen 3.8 Flash</option>
                        <option value="qwen/qwen3.8-27b">Qwen 3.8 27B</option>
                        <option value="mistralai/mistral-large-2512">Mistral Large 3</option>
                        <option value="mistralai/mistral-small-2603">Mistral Small 4</option>
                        <option value="meta-llama/llama-4-maverick">Llama 4 Maverick</option>
                        <option value="meta-llama/llama-3.1-70b-instruct">Llama 3.1 70B</option>
                        <option value="nvidia/nemotron-3.5-lightning">Nemotron 3.5 Lightning</option>
                        <option value="minimax/minimax-m3">MiniMax M3</option>
                    </select>
                    <button id="chat-start-btn" class="btn">Start Chat</button>
                </div>
            </div>
            <div id="chat-container" class="chat-container" style="display: none;">
                <textarea id="chat-messages" class="chat-messages" readonly></textarea>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Type your message..." />
                    <button id="chat-send-btn" class="btn btn-primary chat-send-btn">Send</button>
                    <button id="chat-continue-btn" class="btn btn-primary chat-continue-btn">Continue</button>
                </div>
                <div id="chat-status" class="chat-status">Ready</div>
            </div>
        </div>
        
        <div id="docmem-tab" class="tab-content">
            <h1>Docmem</h1>
            <div class="toolbar docmem-controls">
                <button id="create-docmem-btn" class="btn">Create New Docmem</button>
                <input type="text" id="docmem-id-input" class="input" placeholder="Docmem ID" />
                <button id="refresh-roots-btn" class="btn">Refresh Roots</button>
            </div>
            <div id="docmem-container" class="docmem-container">
                <p>Create or load a docmem to begin</p>
            </div>
        </div>
        
        <div id="view-tab" class="tab-content">
            <div class="view-container">
                <div id="view-roots-bar" class="view-roots-bar"></div>
                <div class="view-main">
                    <div class="view-token-controls">
                        <label for="view-token-limit">Expand to tokens:</label>
                        <input type="number" id="view-token-limit" class="input" placeholder="e.g. 1000" min="1" />
                        <button id="view-expand-btn" class="btn btn-primary">Expand</button>
                        <button id="view-expand-all-btn" class="btn btn-primary">Expand All</button>
                        <button id="view-structure-btn" class="btn">Structure</button>
                        <button id="view-serialize-btn" class="btn">Serialize</button>
                    </div>
                    <div id="view-content-panel" class="view-content-panel"></div>
                </div>
            </div>
        </div>
        
        <div id="persist-tab" class="tab-content">
            <div class="persist-container">
                <div id="persist-roots-bar" class="persist-roots-bar"></div>
                <div class="persist-main">
                    <div class="persist-controls">
                        <button id="persist-save-btn" class="btn">Save .toml</button>
                        <button id="persist-load-btn" class="btn">Load .toml</button>
                        <input type="file" id="persist-file-input" accept=".toml" style="display: none;" />
                        <button id="persist-upload-text-btn" class="btn">Upload Text File</button>
                        <input type="file" id="persist-text-file-input" accept=".txt,text/plain" style="display: none;" />
                        <button id="persist-upload-paragraph-btn" class="btn">Upload Paragraph File</button>
                        <input type="file" id="persist-paragraph-file-input" accept=".txt,text/plain" style="display: none;" />
                        <button id="persist-remove-btn" class="btn">Remove</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="message-bar" class="message-bar">
        <span id="message-text"></span>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/gpt-tokenizer@2.1.2/index.js"></script>
    <script type="module" src="./js/tools.js"></script>
    <script type="module" src="./js/docmem_tools/docmem_types.js"></script>
    <script type="module" src="./js/docmem_tools/docmem_sqlite.js"></script>
    <script type="module" src="./js/docmem_tools/docmem.js"></script>
    <script type="module" src="./js/system_prompts/seed.js"></script>
    <script type="module" src="./js/docmem_chat.js"></script>
    <script type="module" src="./js/pytool/pytool_parser.js"></script>
    <script type="module" src="./js/docmem_tools/docmem_commands.js"></script>
    <script type="module" src="./js/persist/toml.js"></script>
    <script type="module" src="./js/persist/line.js"></script>
    <script type="module" src="./js/persist/paragraph.js"></script>
    <script type="module" src="./js/agent_loop.js"></script>
    <script type="module" src="./js/chat.js"></script>
    <script type="module" src="./js/index.js"></script>
</body>
</html>
